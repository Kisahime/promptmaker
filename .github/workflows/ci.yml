name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 > /dev/null
          pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes promptmaker tests
      - name: Tests
        run: python -m pytest -q
      - name: Headless smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --smoke-test
